name: OwlGate release gate

# On every pull request: send the change to the OwlGate agent on UiPath and let
# its go / no-go verdict gate the merge. Make this check "required" in branch
# protection to actually block merges on a no-go.
on:
  pull_request:

permissions:
  contents: read

env:
  UIPATH_BASE: https://staging.uipath.com
  UIPATH_ACCOUNT: hackathon26_631
  UIPATH_TENANT: DefaultTenant
  UIPATH_FOLDER_ID: "3083518"                              # Shared folder
  UIPATH_RELEASE_KEY: 50B79B66-CB76-4A8F-98C1-DF55264D85A2 # owlgate-gate (re-check if you redeploy)
  UIPATH_SCOPE: OR.Jobs

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Don't block PRs before the UiPath credentials are configured.
      - name: Check configuration
        id: cfg
        env:
          CID: ${{ secrets.UIPATH_CLIENT_ID }}
        run: |
          if [ -z "$CID" ]; then
            echo "::notice::OwlGate secrets not set — skipping the gate (neutral pass)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the diff payload (with hunks)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          python3 .github/owlgate/build-diff.py "origin/${{ github.base_ref }}...HEAD" > diff.json
          echo "Changed code sent to OwlGate:"; cat diff.json

      - name: Run the OwlGate gate
        if: steps.cfg.outputs.ready == 'true'
        env:
          UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
        run: bash .github/owlgate/gate.sh diff.json
